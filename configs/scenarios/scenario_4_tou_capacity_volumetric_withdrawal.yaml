# Configuration file

# ============================= Scenario parameters ============================
scenario_params:
  year: 2050  # Year of the data to be used (used as wildcard in data source paths)

# ============================== Model parameters ==============================
model_params:
  num_snapshots: 8760  # Between 1 to 8760 (full year run)
  solver_options:
    gurobi: # Can be any solver that works with linopy e.g., highs, glpk, gurobi, etc.
      # See https://docs.gurobi.com/projects/optimizer/en/current/reference/parameters.html#parameter-reference
      Method: 2  # Use barrier (interior-point) but do not run simplex in parallel
      Crossover: 0  # Stop after barrier, do not perform crossover
      OptimalityTol: 1.e-4
      FeasibilityTol: 1.e-4
      BarConvTol: 1.e-5
      BarHomogeneous: 1  # Use homogeneous barrier if standard does not converge
      MIPGap: 1.e-2  # Relative MIP gap (1.e-2 = 0.01 = 1%)

# ================================ Data sources ================================
data_sources:
  heat_system:
    static_prices: "data/heat_system/static_prices.csv"
    electricity_price: "data/heat_system/{year}/electricity_price.csv"  #  Year is a wildcard!
    hydrogen_price: "data/heat_system/{year}/hydrogen_price.csv"  #  Year is a wildcard!
    temperature: "data/heat_system/{year}/temperature.csv"  #  Year is a wildcard!
    solar_availability: "data/heat_system/{year}/solar_thermal.csv"  #  Year is a wildcard!
    demand: "data/heat_system/{year}/demand.csv"  #  Year is a wildcard!
    etm_heat_network_profiles: "data/heat_system/{year}/etm_heat_network_profiles.csv"  # Energy Transition Model profiles
    network: "data/heat_system/network/greenfield/heat-network.xlsm"

  electricity_system:
    loads: "data/electricity_system/{year}/power_profiles/loads.csv"  #  Year is a wildcard!
    network: "data/electricity_system/{year}/network/electricity-network.xlsx"  #  Year is a wildcard!


# ============================ Scenario adjustments ============================
scenario_adjustments:
  # The demand increase factor for different areas can be set here.
  heat_demand_settings:
    denhaag: 3  # Increase demand in The Hague by 200%
    rotterdam1: 1.3
    rotterdam2: 1.5
    tuinders: 1.5

  apply_normalization_using_etm_profiles: true  # If present, heat demand is normalized using ETM normalized profile.

  # Correct heat demand in summer for specific regions by setting it to the minimum
  # demand value in the entire year to avoid unrealistic peaks in summer.
  # summer_period_demand_correction:
  #   months:
  #     - July
  #     - August
  #   decrease_factor:
  #     denhaag: 0.2
  #     rotterdam1: 0.5

  electricity_price_settings:
    scaling_factor: 1.7  # Factor to increase/decrease electricity prices
    max_price: 400  # Maximum electricity price (€/MWh) to clip extreme values

  hydrogen_price_settings:
    scaling_factor: 2.8  # Factor to increase/decrease hydrogen prices
    max_price: 250  # Maximum hydrogen price (€/MWh) to clip extreme values

  # temperature_settings:
  #   increase_degree: 0  # Increase temperature by this many degrees Celsius (can be negative for decrease)
  #   min_temp: -10  # Minimum temperature (°C) to clip extreme values
  #   max_temp: 50  # Maximum temperature (°C) to clip extreme values

  solar_thermal_settings:
    scaling_factor: 3000000  # Factor to increase/decrease solar availability
    max_capacity_factor: 0.95  # Maximum capacity factor (between 0 and 1) to clip extreme values

  static_prices_settings:  # Set absolute values here for energy carriers with static (non-time-varying) prices in €/MWh
    greengas: 80 
    waste_material: 30
    residual_heat: 20

  # The new value of technologies in the network can be set here.
  assets_value_settings:
    Link:
      p_nom_min:
        pipe_1: 1
        pipe_2: 1
        pipe_3: 1
        pipe_4: 1
        pipe_5: 1
        pipe_6: 1
        pipe_7: 1
        pipe_8: 1
        pipe_9: 1
        pipe_10: 1
        pipe_11: 1
        pipe_12: 1
        pipe_13: 1
        pipe_14: 1
        pipe_15: 1
      
      p_nom_max:
        roca_e_boiler: 150
        rotterdam1_e_boiler_2: 100
        rotterdam1_geothermal_2: 60
        tuinders_geothermal: 50
        crplein_greengas_boiler: 75
        denhaag_greengas_boiler: 100
        tuin_tran_greengas_boiler: 25
        tuinders_greengas_boiler: 25
        rotterdam1_greengas_boiler: 75
        roca_greengas_boiler: 100

        pipe_1: 250
        pipe_8: 250
        pipe_14: 250

      # capital_cost:
      #   crplein_geothermal: 0
      #   crplein_geothermal_booster: 0
      #   tuinders_ht_ates_charger: 0
      #   tuinders_ht_ates_discharger: 0

    Generator:
      p_nom_max:
        tuinders_solarthermal: 200
        indus_waste_heat_point_v: 200
        indus_waste_heat_rotterdam1: 200

      capital_cost:
        electricity_supply: 0

    StorageUnit:
      p_nom_max:
        cr_plein_storage: 50
        denhaag_storage: 100
        tuinders_storage: 50
        b_triangle_storage: 50
        rotterdam1_storage: 100
        roca_storage: 100

    Store:
      e_nom_max:
        tuinders_ht_ates_store: 120000
      # capital_cost:
      #   tuinders_ht_ates_store: 0

# ============================== Grid tariffs =================================
# FULL SCHEMA - all fields that can be set under `tariffs` (omit any to disable that piece):
#   tariffs:
#     generation:                       # read by generate_tariffs.py to BUILD the tariff_params files
#       withdrawal_schedule: <csv>      # month x hour weighting schedule (e.g. data/weighting_factors_distribution.csv)
#       base_rate_eur_per_mwh: <float>  # volumetric base rate; Stedin 2026 MS=19.8 (LS=74.9 normaal/46.0 laag)
#       base_year: <int>               # year the base levels refer to (2026)
#       target_year: <int>             # year to escalate volumetric to (default: scenario_params.year)
#       annual_growth_rate: <float>    # real CAGR; FIEN26 ~0.037 low / 0.047 mid / 0.063 high; 0.0 = none
#       include_holidays: <bool>       # treat Dutch public holidays as weekend (default true)
#     withdrawal:                       # tariffs APPLIED on grid withdrawal (read by load_tariffs)
#       volumetric: <filename>          # EUR/MWh profile in tariff_params/ (e.g. vol_flat.csv, vol_tou_withdrawal.csv)
#       capacity:
#         level: <float>                # EUR/MW-month (escalate manually for future years)
#         weights: <filename>           # hourly weights in tariff_params/ (omit -> unweighted)
#     injection:                        # same fields as withdrawal (omit whole block -> no injection tariff)
#       volumetric: <filename>          # e.g. vol_tou_injection.csv
#       capacity: { level: <float>, weights: <filename> }   # e.g. weights_injection.csv
# Bare filenames resolve to results/<config-stem>/inputs/tariff_params/ (built by generate_tariffs.py).
# generate_tariffs.py always produces: vol_flat.csv, vol_tou_withdrawal.csv, vol_tou_injection.csv,
#   weights_withdrawal.csv, weights_injection.csv (+ the two schedules and a heatmap).
# Scenario 4 - ToU cap+vol, withdrawal
# Targets: Is a capacity charge enough, or is a volumetric ToU layer also needed?
# Isolated by contrast: 3 -> 4 (combination)
tariffs:
  # generation: parameters used by generate_tariffs.py to build this scenario's tariff_params files
  generation:
    withdrawal_schedule: data/weighting_factors_distribution.csv  # 10/25 kV (ACM). Use _transmission for 150 kV.
    base_rate_eur_per_mwh: 19.8   # Stedin 2026 MS kWh rate
    base_year: 2026
    target_year: 2050             # = scenario_params.year
    annual_growth_rate: 0.0       # 0.0 = 2026 levels; set ~0.047 for FIEN26-mid 2050 (then also escalate capacity 'level')
    include_holidays: true
  withdrawal:
    volumetric: vol_tou_withdrawal.csv
    capacity:
      level: 5294.0
      weights: weights_withdrawal.csv
