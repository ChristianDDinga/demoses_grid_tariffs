# Manifest of grid-tariff scenarios (1-5 core, 6 exploratory).
# Tariff files live in each scenario's tariff_params_dir, generated by generate_tariffs.py.
scenarios:
- id: 1
  name: scenario_1_flat_volumetric
  label: Flat volumetric (status quo, EU)
  question: 'Format baseline: per-energy level charge, no peak/time signal (roadmap
    Tariff 0).'
  contrast: reference
  config: configs/scenarios/scenario_1_flat_volumetric.yaml
  results_dir: results/scenario_1_flat_volumetric/outputs
  tariff_params_dir: results/scenario_1_flat_volumetric/inputs/tariff_params
- id: 2
  name: scenario_2_capacity_withdrawal
  label: Capacity, withdrawal (NL status quo)
  question: Does a peak (capacity) charge beat a flat energy charge for grid relief?
    (current NL >5 MW status quo)
  contrast: 1 -> 2 (format)
  config: configs/scenarios/scenario_2_capacity_withdrawal.yaml
  results_dir: results/scenario_2_capacity_withdrawal/outputs
  tariff_params_dir: results/scenario_2_capacity_withdrawal/inputs/tariff_params
- id: 3
  name: scenario_3_tou_capacity_withdrawal
  label: ToU capacity, withdrawal (reform)
  question: Does time-of-use weighting (the ACM/Stedin kWmax reform) cut coincident
    grid loading?
  contrast: 2 -> 3 (timing)
  config: configs/scenarios/scenario_3_tou_capacity_withdrawal.yaml
  results_dir: results/scenario_3_tou_capacity_withdrawal/outputs
  tariff_params_dir: results/scenario_3_tou_capacity_withdrawal/inputs/tariff_params
- id: 4
  name: scenario_4_tou_capacity_volumetric_withdrawal
  label: ToU cap+vol, withdrawal
  question: Is a capacity charge enough, or is a volumetric ToU layer also needed?
  contrast: 3 -> 4 (combination)
  config: configs/scenarios/scenario_4_tou_capacity_volumetric_withdrawal.yaml
  results_dir: results/scenario_4_tou_capacity_volumetric_withdrawal/outputs
  tariff_params_dir: results/scenario_4_tou_capacity_volumetric_withdrawal/inputs/tariff_params
- id: 5
  name: scenario_5_tou_capacity_both
  label: ToU capacity, both (injection)
  question: Should injection (feed-in) be charged too? Injection uses reversed weights.
  contrast: 3 -> 5 (direction)
  config: configs/scenarios/scenario_5_tou_capacity_both.yaml
  results_dir: results/scenario_5_tou_capacity_both/outputs
  tariff_params_dir: results/scenario_5_tou_capacity_both/inputs/tariff_params
- id: 6
  name: scenario_6_tou_capacity_volumetric_both
  label: ToU cap+vol, both (full symmetric)
  question: 'EXPLORATORY: does the full symmetric design differ from capacity-only?
    (roadmap Tariff E)'
  contrast: 5 -> 6 / 4 -> 6
  config: configs/scenarios/scenario_6_tou_capacity_volumetric_both.yaml
  results_dir: results/scenario_6_tou_capacity_volumetric_both/outputs
  tariff_params_dir: results/scenario_6_tou_capacity_volumetric_both/inputs/tariff_params
